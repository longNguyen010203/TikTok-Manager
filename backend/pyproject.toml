[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-manager-backend"
version = "0.1.0"
description = "Backend API for TikTok Manager"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "integration: exercises the API with an isolated real database",
]
testpaths = ["tests"]
