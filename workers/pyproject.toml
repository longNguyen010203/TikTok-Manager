[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-manager-worker"
version = "0.1.0"
description = "Background worker for TikTok Manager"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
tiktok-worker = "worker.__main__:main"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
testpaths = ["tests"]
